# Evaluation config: frozen, run-once BigCodeBench (BCB) test-split eval.
#
# Mirrors the ALFWorld eval_seen/eval_unseen convention in this repo
# (rl_alf_config.eval_seen.yaml / eval_unseen.yaml): run this AFTER a
# train-mode run (rl_bcb_config.yaml) has built a skill_memory.sqlite, not
# against a fresh graph. Unlike bcb_run_validation's periodic val checks
# during training, the test split here is never touched until this run --
# that is the whole point of keeping it separate from val.
#
# IMPORTANT:
# - This YAML must match `memrl.configs.config.MempConfig` (extra fields are forbidden).
# - The test split itself is a CLI concern, same as train_ratio/split_file:
#     python run/run_bcb.py --config configs/rl_bcb_config.eval_test.yaml \
#       --test_ratio 0.15 --train_ratio 0.7
#   or, if your --split_file JSON already defines a non-empty "test_ids"
#   list, no --test_ratio is needed -- the split file wins.
# - Before running: set memory.skill_db_path below to the skill_memory.sqlite
#   produced by the train run (e.g.
#   results/bigcodebench/exp_bcb_memrl_<run_id>/skill_memory.sqlite).
# - You must replace llm.api_key / embedding.api_key before running.

llm:
  provider: "openai"
  # NOTE: do not commit real keys/endpoints in this file.
  # Create a local copy `configs/rl_bcb_config.local.yaml` (gitignored) for private values.
  api_key: "sk-REPLACE_ME"
  base_url: "https://api.openai.com/v1"
  api_version: null
  model: "gpt-4o-mini"
  temperature: 0.0  # Greedy decoding at evaluation, matching the ALFWorld eval configs.
  max_tokens: 12800

embedding:
  provider: "openai"
  # NOTE: do not commit real keys/endpoints in this file.
  # Create a local copy `configs/rl_bcb_config.local.yaml` (gitignored) for private values.
  api_key: "sk-REPLACE_ME"
  base_url: "https://api.openai.com/v1"
  api_version: null
  model: "text-embedding-3-large"
  max_text_len: 8196

memory:
  # Strategies (keep consistent with the other MemRL benchmarks in this repo)
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"

  # Retrieval / add thresholds
  k_retrieve: 5
  max_keywords: 8
  confidence_threshold: 0.0
  memory_confidence: 100.0
  add_similarity_threshold: 0.9
  n_sleep: 10
  lambda_base: 1e-3
  memory_budget_tokens: 0

  build_memory: false  # Eval run: graph is read-only -- retrieved/used, never mutated. run_bcb.py also force-overrides this to False for mode=eval_test regardless of what's set here.
  reuse_skill_db: true  # Point at the skill DB built by the train run instead of a fresh one.
  skill_db_path: null  # REQUIRED: set to the trained run's skill_memory.sqlite path before launching.

  mos_config_path: "configs/mos_config.json"
  user_id: "memp_user"

  sim_norm_mean: 0.31
  sim_norm_std: 0.10

  load_from_checkpoint: false
  checkpoint_path: null

environment:
  # Unused by BCB runner; required for a "full" MempConfig.
  alfworld_config_path: "configs/base_config.yaml"
  alfworld_env_type: "AlfredTWEnv"

experiment:
  experiment_name: "bcb_memrl_eval_test"

  algorithm: "rl"
  val_before_train: true
  enable_value_driven: true
  bcb_run_validation: false  # Irrelevant here -- run_bcb.py skips periodic val entirely when mode=eval_test.
  random_seed: 42
  mode: "eval_test"  # Triggers run_bcb.py's frozen, run-once test-split evaluation path.
  max_steps: 1  # BCB is framed as a 1-step episode (submit code, evaluate, done).

  dataset_ratio: 0.7
  few_shot_path: "data/alfworld/alfworld_examples.json"
  bon: 0
  hle_categories: null
  hle_category_ratio: null
  train_valid_split: 0.8

  ckpt_eval_enabled: false
  ckpt_eval_path: null
  ckpt_resume_enabled: false
  ckpt_resume_path: null
  ckpt_resume_epoch: null

  baseline_mode: null
  baseline_k: 10

  output_dir: "./results"
  save_trajectories: true
  save_memories: true
  enable_logging: true
  log_level: "INFO"

rl_config:
  epsilon: 0.1
  tau: 0.35
  alpha: 0.3
  gamma: 0.0
  q_init_pos: 0.0
  q_init_neg: 0.0
  q_floor: null
  success_reward: 1.0
  failure_reward: -1.0
  sim_threshold: 0.5
  topk: 5
  novelty_threshold: 0.85
  recency_boost: 0.0
  reward_merge_gain: 0.1
  q_min_threshold: -0.8
  weight_sim: 0.5
  weight_q: 0.5
