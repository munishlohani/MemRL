# Ray execution profile for ALFWorld EpisodeRunner runs.
#
# Usage:
#   python run/run_alfworld_ray.py --config configs/rl_alf_config.yaml --ray-config configs/rl_alf_ray.yml
#
# This file controls ONLY Ray execution (parallelism, resources, trial
# naming). All actual MemRL hyperparameters -- experiment, memory, llm,
# embedding, rl_config -- live solely in the base MemRL YAML config
# (rl_alf_config.yaml). Trial `overrides` below are intentionally empty so
# a Ray run is byte-for-byte the same hyperparameters as running
# run_alfworld.py directly against the same base config -- there is
# exactly one source of truth for hyperparameters, not two that can
# silently diverge. Add per-trial overrides here only for genuine
# multi-trial sweeps, and keep them minimal.

ray:
  address: local
  local_mode: false
  ignore_reinit_error: true
  log_to_driver: true
  resources_per_trial:
    num_cpus: 1

trials:
  - name: alfworld-baseline
    overrides: {}
