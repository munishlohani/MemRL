# LLM provider configuration
llm:
  provider: "openai"
  api_key: ""
  base_url: ""
  model: "qwen3-32b"  # Matches ExpGraph's (arXiv:2605.30712v1) small-LLM executor for ALFWorld. base_url/api_key must point at whatever endpoint actually serves Qwen3-32B for you -- adjust in rl_alf_config.local.yaml.
  temperature: 0
  max_tokens: 4096

# Embedding provider configuration  
embedding:
  provider: "openai"
  api_key: "sk-REPLACE_ME"
  base_url: "https://api.openai.com/v1"
  model: "text-embedding-3-large"
  max_text_len: 4096

# Memory system configuration
memory:
  # Strategy configuration (main combination from paper)
  build_strategy: "proceduralization"
  retrieve_strategy: "query"
  update_strategy: "adjustment"
  
  # Memory parameters
  k_retrieve: 5
  max_keywords: 8
  confidence_threshold: 0.0
  memory_confidence: 100.0
  add_similarity_threshold: 0.90
  build_memory: true  # Master switch for the whole write side of memory (formation, Q-updates, pruning, sleep consolidation), independent of experiment.mode -- mode only selects the ALFWorld data split (train/eval_in_distribution/eval_out_of_distribution), not whether this is a training run. Set false for evaluation: memory is retrieved/used but never mutated.
  reuse_skill_db: false  # If true AND skill_db_path is set, run scripts use skill_db_path directly instead of a fresh per-run path -- set true (typically with build_memory: false) to evaluate against a specific already-built skill graph.
  skill_db_path: null  # Path to reuse when reuse_skill_db is true. If null, run scripts always fall back to a fresh per-run path regardless of reuse_skill_db.
  n_sleep: 50
  lambda_base: 1e-3  # Base decay rate for tactical nodes (spec sweep range [1e-4, 1e-2] log-scale).
  theta_prune: 0.01  # Retention threshold for tactical node pruning. Disabled for now (was 0.01) while debugging strategic scaffold formation.
  alpha_baseline: 0.1  # EMA rate for the tactical/strategic advantage baselines b(t_k)/b_omega(t_k), shared. Replaces the lifetime running mean. Not yet swept.
  lambda_retrieval: 0.5  # Advantage weight in the retrieval blend (spec §P2.1, shared by tactical and strategic): score = lambda_retrieval * rank_norm(Q) + (1 - lambda_retrieval) * rank_norm(cos(e_i, e_q)). Reasoned default (MemRL's own blend), not swept.
  theta_retrieval: 0.3  # Tactical-only ABSOLUTE relevance floor: drop candidates whose raw cosine similarity to the current context is below this (before rank-norm), so a step retrieves nothing when no child of the active scaffold is relevant. Raw cosine scale (not the blended score); tune per embedding model. 0.0 = no-op; not yet swept.
  ucb_c: 1.0  # Strategic-only UCB1 exploration coefficient: q_i = Q_omega(t_k) + ucb_c * sqrt(ln(N+1)/(n_i+1)), rank-normalized before blending with similarity. Guards against deterministic-argmax option starvation (an early-winning scaffold getting reinforced forever while siblings never accumulate visits). 0.0 = no-op (pure-Q ranking); not yet swept.
  theta_absorb: 0.85  # Sleep consolidation Pass 1 (algorithmic): a cluster absorbs into the closest existing scaffold if cosine(cluster_centroid, scaffold.embedding) exceeds this. Not yet swept.
  n_min_spawn: 2  # Minimum cluster size to spawn a new scaffold when no existing scaffold clears theta_absorb; smaller clusters are discarded. Also caps clustering's k so small eligible pools aren't fragmented below this size. Lowered from 3 -- with few eligible nodes, default-k was producing clusters too small to ever spawn.
  # MemOS configuration
  mos_config_path: "configs/mos_config_final.json"
  user_id: "memrl_user"
  sim_norm_mean: 0.5187
  sim_norm_std: 0.1203

# Environment-specific settings
environment:
  # ALFWorld settings
  alfworld_config_path: "configs/envs/alfworld.yaml"
  alfworld_env_type: "AlfredTWEnv"

# Experiment configuration
experiment:
  random_seed: 42
  enable_value_driven: true
  experiment_name: 'alfworld_memrl'  # Name for Trail.
  mode: 'train'  # control whether to only test, if set as 'test' won't run on train spilt.
  num_sections: 10  # Fallback if num_games can't be resolved (num_epochs below takes priority when set).
  num_epochs: 1  # 1 full pass through the collected game set (train split has 3553 tasks). Overrides num_sections with num_epochs * ceil(num_games / batch_size).
  batch_size: 30  # Number of parallel environments for sampling (mini-batch). Matches MemRL's original batch_size.
  max_steps: 50  # Max steps per episode. Reverted from 30 (tuned for a SkillPyramid comparison) -- comparison target is now ExpGraph (arXiv:2605.30712v1), whose own ALFWorld baselines average close to 40-49 steps, implying a step cap near the ReAct/Reflexion field-standard 50, not a lower one.
  dataset_ratio: 1.0  # Proportion of files randomly selected for training (rest used for validation)
  few_shot_path: 'data/alfworld/alfworld_examples.json' # path for alfworld examples
  baseline_mode: none   # passk
  baseline_k: 10

  # Output settings
  output_dir: "./results"
  save_trajectories: true
  save_memories: true
  ckpt_eval_enabled: false
  ckpt_eval_path: ""
  ckpt_resume_enabled: false
  ckpt_resume_path: ""
  ckpt_resume_epoch: null

# RL Configs:s
rl_config:
  epsilon: 0             # ε-greedy exploration probability
  tau: 0.62              # unknown detection threshold on similarity
  alpha: 0.3             # Q-learning step size
  gamma: 0.0             # discount factor (single-step default)
  q_init_pos: 0          # optimistic initialization
  q_init_neg: 0          # negative q init
  success_reward: 1.0
  failure_reward: -1.0
  topk: 3                  # candidate set size for value-aware selection
  novelty_threshold: 0.85  # similarity to treat as non-novel (merge)
  recency_boost: 0.0     # optional recency weight
  reward_merge_gain: 0.1 # gain for attributing success to close memories
  q_min_threshold: -10
  weight_sim: 0.5        # weight for similarity in combined score
  weight_q: 0.5          # weight for Q-value in combined score
